name: PR validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes -o requirements.txt
          git diff --exit-code requirements.txt

      - name: Server imports
        run: uv run python -c "import server"

      - name: List registered tools
        run: uv run fastmcp inspect server.py

      - name: Run tests
        run: uv run pytest tests
